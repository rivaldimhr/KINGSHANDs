name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-test:
    name: Test versi web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pasang pytest + Playwright
        run: |
          pip install -q pytest playwright
          python -m playwright install --with-deps chromium
      - name: Jalankan test
        run: python -m pytest tests/web -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build JAR
        run: mvn -B -q package
      - name: Bundle (JAR + gambar)
        run: |
          mkdir -p dist/KingsHand
          cp target/KingsHand.jar dist/KingsHand/
          cp -r img dist/KingsHand/
          printf 'java -jar KingsHand.jar\n' > dist/KingsHand/run.sh
          printf 'java -jar KingsHand.jar\r\n' > dist/KingsHand/run.bat
          cd dist && zip -qr KingsHand.zip KingsHand
      - uses: actions/upload-artifact@v4
        with:
          name: KingsHand
          path: dist/KingsHand.zip
      - name: Rilis "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/KingsHand.zip --title "KingsHand (build terbaru)" \
            --notes "Butuh Java 17+. Ekstrak, lalu jalankan run.bat (Windows) atau run.sh (macOS/Linux)."
